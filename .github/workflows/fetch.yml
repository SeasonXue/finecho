name: fetch youtube transcripts

on:
  schedule:
    # 北京时间 12:00 = UTC 04:00，周一到周五
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: fetch-youtube
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp (latest via pipx)
        # apt 源里的 yt-dlp 常落后数月；YouTube 反爬频繁改接口，用 pipx 装最新版更稳。
        run: |
          pipx install yt-dlp
          yt-dlp --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch new transcripts
        run: bun run fetch

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add data/
            git commit -m "chore(data): scheduled fetch $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "no new transcripts"
          fi
